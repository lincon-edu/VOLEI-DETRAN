<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotação Vôlei</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding-bottom: 75px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16a34a; color: white; padding: 12px 16px; font-weight: bold; font-size: 17px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header button { border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-auth { background: #15803d; color: white; border: 1px solid #86efac !important; }
        .btn-danger { background: #ef4444; color: white; }
        .content { padding: 16px; flex: 1; }
        
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
        .card-header { background: #f9fafb; padding: 10px 14px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #16a34a; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .input-group input { flex: 1; min-width:0; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
        .input-group select { width:72px; padding:12px 8px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; background:white; }
        .sex-tag { font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px; margin-left:6px; background:#e5e7eb; color:#4b5563; }
        .sex-tag.f { background:#fce7f3; color:#9d174d; }
        .btn-add { background: #16a34a; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; }

        ul { list-style: none; }
        li { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        li:last-child { border-bottom: none; }

        .check-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px; }
        .btn-del { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 6px; }

        .start-btn { width: 100%; background: #16a34a; color: white; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Quadra */
        .teams-grid { display: flex; gap: 10px; margin-bottom: 16px; }
        .team-col { flex: 1; border-radius: 8px; border: 2px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; background: white; }
        .team-a { border-color: #3b82f6; }
        .team-b { border-color: #ef4444; }
        .team-title { color: white; padding: 8px 10px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; }
        .team-title-a { background: #3b82f6; }
        .team-title-b { background: #ef4444; }
        .team-list { min-height: 140px; padding: 6px; flex: 1; }
        .team-list li { padding: 6px 4px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #f9fafb; }
        .btn-win-a { width: 100%; padding: 12px 0; background: #dbeafe; color: #1e40af; border: none; border-top: 1px solid #bfdbfe; font-weight: bold; cursor: pointer; }
        .btn-win-b { width: 100%; padding: 12px 0; background: #fee2e2; color: #991b1b; border: none; border-top: 1px solid #fecaca; font-weight: bold; cursor: pointer; }

        /* Fila */
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
        .queue-item.priority { background: #fff7ed; border-left: 4px solid #f97316; }
        .queue-controls button { background: #f3f4f6; border: 1px solid #e5e7eb; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .tag-wait { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e5e7eb; font-weight: bold; }
        .tag-wait.urgent { background: #f97316; color: white; }

        /* Resenha / Ranking */
        .rank-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f3f4f6; }
        .rank-pos { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #fff; background: #9ca3af; }
        .rank-pos.gold { background: #eab308; }
        .rank-pos.silver { background: #94a3b8; }
        .rank-pos.bronze { background: #d97706; }
        .rank-details { flex: 1; }
        .rank-stats { display: flex; gap: 12px; font-size: 12px; color: #6b7280; margin-top: 2px; }
        .rank-pct { text-align: right; }
        .rank-pct-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: bold; }
        .rank-pct-val { font-size: 15px; font-weight: bold; color: #16a34a; }

        /* Modal Login */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 360px; padding: 20px; border-radius: 12px; }
        .modal-body h3 { margin-bottom: 12px; }
        .modal-body input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

        /* Tabbar */
        .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 60px; background: white; border-top: 1px solid #e5e7eb; display: flex; z-index: 20; }
        .tab-btn { flex: 1; border: none; background: transparent; font-weight: bold; font-size: 13px; color: #6b7280; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .tab-btn.active { color: #16a34a; border-top: 3px solid #16a34a; }
        .status-btn { width:28px; height:28px; border:none; border-radius:7px; color:white; font-weight:bold; cursor:pointer; flex-shrink:0; }
        .status-confirmado { background:#16a34a; }
        .status-ausente { background:#ef4444; }
        .status-pendente { background:#f59e0b; }
        .status-label { font-size:10px; font-weight:bold; margin-left:6px; padding:2px 6px; border-radius:10px; white-space:nowrap; }
        .status-label.confirmado { background:#dcfce7; color:#166534; }
        .status-label.ausente { background:#fee2e2; color:#991b1b; }
        .status-label.pendente { background:#fef3c7; color:#92400e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>🏐 Vôlei Detran</span>
            <div class="header-actions">
                <button id="btn-login" class="btn-auth" onclick="openLoginModal()">🔑 Entrar ADM</button>
                <button id="btn-reset" class="btn-danger" style="display:none;" onclick="resetGame()">Reiniciar</button>
            </div>
        </div>

        <!-- ABA 1: LISTA -->
        <div class="content" id="tab-lista">
            <div class="input-group" id="admin-add-section" style="display:none;">
                <input type="text" id="player-name" placeholder="Adicionar jogador..." onkeydown="if(event.key==='Enter') addPlayer()">
                <select id="player-sex" aria-label="Sexo"><option value="M">M</option><option value="F">F</option></select>
                <button class="btn-add" onclick="addPlayer()">+</button>
            </div>
            <div class="card">
                <div class="card-header">
                    <span>Lista de Jogadores</span>
                    <span class="badge" id="confirmed-count">0 Confirmados</span>
                </div>
                <ul id="players-list" style="max-height: 480px; overflow-y: auto;"></ul>
                <div id="player-summary" style="padding:12px 14px; border-top:1px solid #e5e7eb; background:#f9fafb; font-size:13px; line-height:1.7;">
                    <div><strong>Total Mulheres:</strong> <span id="total-female">0</span></div>
                    <div><strong>Total Homens:</strong> <span id="total-male">0</span></div>
                    <div><strong>Total jogadores:</strong> <span id="total-players">0</span></div>
                </div>
            </div>
            <button class="start-btn" id="btn-start" style="display:none;" onclick="startGame()">Começar Jogo ➔</button>
        </div>

        <!-- ABA 2: QUADRA -->
        <div class="content" id="tab-quadra" style="display:none;">
            <div class="teams-grid">
                <div class="team-col team-a" id="card-team-a">
                    <div class="team-title team-title-a"><span>TIME A</span><span id="wins-a">0 🏆</span></div>
                    <ul class="team-list" id="list-team-a"></ul>
                    <button class="btn-win-a" id="btn-win-a" style="display:none;" onclick="handleWin('A')">VENCEU</button>
                </div>
                <div class="team-col team-b" id="card-team-b">
                    <div class="team-title team-title-b"><span>TIME B</span><span id="wins-b">0 🏆</span></div>
                    <ul class="team-list" id="list-team-b"></ul>
                    <button class="btn-win-b" id="btn-win-b" style="display:none;" onclick="handleWin('B')">VENCEU</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>Fila de Espera</span>
                    <span style="font-size:12px; color:#6b7280;" id="queue-count">0 pessoas</span>
                </div>
                <ul id="queue-list" style="max-height: 420px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- ABA 3: RESENHA -->
        <div class="content" id="tab-resenha" style="display:none;">
            <div class="card">
                <div class="card-header" style="background: #15803d; color: white;">
                    <span>📊 Estatísticas & Ranking</span>
                    <span style="font-size:11px; opacity:0.9;">Mais Vitórias</span>
                </div>
                <ul id="resenha-list" style="max-height: 520px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- TABBAR INFERIOR -->
        <div class="tabbar">
            <button class="tab-btn active" id="btn-tab-lista" onclick="switchTab('lista')">Lista</button>
            <button class="tab-btn" id="btn-tab-quadra" onclick="switchTab('quadra')">Quadra</button>
            <button class="tab-btn" id="btn-tab-resenha" onclick="switchTab('resenha')">Resenha</button>
        </div>
    </div>

    <!-- MODAL DE LOGIN ADM -->
    <div class="modal" id="login-modal">
        <div class="modal-body">
            <h3>Acesso Administrativo</h3>
            <input type="text" id="admin-email" placeholder="E-mail">
            <input type="password" id="admin-pass" placeholder="Senha">
            <div class="modal-actions">
                <button onclick="closeLoginModal()" style="padding:8px 12px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer;">Cancelar</button>
                <button onclick="loginAdmin()" style="padding:8px 14px; background:#16a34a; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL='https://oxacdamrkrokzocamvfw.supabase.co';
const SUPABASE_KEY='sb_publishable_uusWwV0ef8ux-Dr__IFlPA_WGwQpAqO';
const {createClient}=supabase;
const db=createClient(SUPABASE_URL,SUPABASE_KEY);
let currentAdmin=null,currentTab='lista',gameStarted=false,teamAWins=0,teamBWins=0;
let players=[],nextQueueOrder=1,teamA=[],teamB=[],queue=[];let rtTimer=null,loading=false;
const jogadoresIniciais=[['Victor','M'],['Joao V','M'],['Glauber','M'],['Lucas','M'],['Mateus','M'],['Gabriel','M'],['Rafael','M'],['João','M'],['Pedro','M'],['Tiago','M'],['Marcos','M'],['André','M'],['Felipe','M'],['Carlos','M'],['Eduardo','M'],['Marcelo','M'],['Gustavo','M'],['Fernando','M'],['Bruno','M'],['Diego','M'],['Leonardo','M'],['Thiago','M'],['Rodrigo','M'],['Ana','F'],['Julia','F'],['Beatriz','F'],['Mariana','F'],['Camila','F'],['Letícia','F'],['Amanda','F']];
function mapPlayer(r){
    const status=r.status||(r.confirmado?'confirmado':'ausente');
    return{id:+r.id,name:r.nome,sex:r.sexo,status,confirmed:status==='confirmado',matches:+(r.partidas||0),wins:+(r.vitorias||0),waitCount:+(r.espera||0),queueOrder:+(r.queue_order||r.id)}
}
function statePayload(){return{id:1,iniciado:gameStarted,vitorias_time_a:teamAWins,vitorias_time_b:teamBWins,time_a:teamA.map(p=>p.id),time_b:teamB.map(p=>p.id),fila:queue.map(p=>p.id)}}
async function loadState(){if(loading)return;loading=true;try{const [pr,sr]=await Promise.all([db.from('jogadores').select('id,nome,sexo,status,confirmado,partidas,vitorias,espera,queue_order').order('queue_order'),db.from('estado_jogo').select('*').eq('id',1).maybeSingle()]);if(pr.error)throw pr.error;if(sr.error)throw sr.error;players=(pr.data||[]).map(mapPlayer);nextQueueOrder=players.reduce((m,p)=>Math.max(m,p.queueOrder),0)+1;const s=sr.data;const byId=new Map(players.map(p=>[p.id,p]));if(s){gameStarted=!!s.iniciado;teamAWins=+(s.vitorias_time_a||0);teamBWins=+(s.vitorias_time_b||0);teamA=(s.time_a||[]).map(id=>byId.get(+id)).filter(Boolean);teamB=(s.time_b||[]).map(id=>byId.get(+id)).filter(Boolean);queue=(s.fila||[]).map(id=>byId.get(+id)).filter(Boolean)}else{gameStarted=false;teamAWins=teamBWins=0;teamA=[];teamB=[];queue=[]}render()}catch(e){console.error(e);alert('Não foi possível carregar os dados do Supabase.')}finally{loading=false}}
async function persistPlayers(){const rows=players.map(p=>({id:p.id,nome:p.name,sexo:p.sex,status:p.status,confirmado:p.status==='confirmado',partidas:p.matches,vitorias:p.wins,espera:p.waitCount,queue_order:p.queueOrder}));const {error}=await db.from('jogadores').upsert(rows,{onConflict:'id'});if(error)throw error}
async function persistState(){const {error}=await db.from('estado_jogo').upsert(statePayload(),{onConflict:'id'});if(error)throw error}
function syncWaitCounts(){const counts=new Map();queue.forEach(p=>counts.set(p.id,p.waitCount));teamA.forEach(p=>counts.set(p.id,p.waitCount));teamB.forEach(p=>counts.set(p.id,p.waitCount));players.forEach(p=>{if(counts.has(p.id))p.waitCount=counts.get(p.id);else p.waitCount=0})}
async function persistAll(){syncWaitCounts();await Promise.all([persistPlayers(),persistState()])}
function setupRealtime(){db.channel('volei-detran-sync').on('postgres_changes',{event:'*',schema:'public',table:'jogadores'},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(loadState,200)}).on('postgres_changes',{event:'*',schema:'public',table:'estado_jogo'},()=>{clearTimeout(rtTimer);rtTimer=setTimeout(loadState,200)}).subscribe()}
function render() {
            const isAdmin = currentAdmin !== null;

            // Header ADM
            const btnLogin = document.getElementById('btn-login');
            if (isAdmin) {
                btnLogin.innerText = `Sair (${currentAdmin})`;
                btnLogin.onclick = logoutAdmin;
                btnLogin.className = 'btn-danger';
            } else {
                btnLogin.innerText = '🔑 Entrar ADM';
                btnLogin.onclick = openLoginModal;
                btnLogin.className = 'btn-auth';
            }

            document.getElementById('admin-add-section').style.display = isAdmin ? 'flex' : 'none';

            // Lista Convocados
            const listEl = document.getElementById('players-list');
            listEl.innerHTML = '';
            const confirmed = players.filter(p => p.status === 'confirmado');
            document.getElementById('confirmed-count').innerText = `${confirmed.length}/30 Confirmados`;

            players.forEach((p, idx) => {
                const li = document.createElement('li');
                const statusClass = p.status === 'confirmado' ? 'status-confirmado' : p.status === 'ausente' ? 'status-ausente' : 'status-pendente';
                const statusLabel = p.status === 'confirmado' ? 'Confirmado' : p.status === 'ausente' ? 'Ausente' : 'Pendente';
                const statusIcon = p.status === 'confirmado' ? '✓' : p.status === 'ausente' ? '✕' : '?';
                li.innerHTML = `
                    <div style="display:flex; align-items:center; min-width:0;">
                        <button class="status-btn ${statusClass}" title="${isAdmin ? 'Clique para alterar o status' : statusLabel}" ${isAdmin ? `onclick="togglePresence(${p.id})"` : 'disabled'}>${statusIcon}</button>
                        <span style="width:28px; color:#6b7280; font-size:13px; font-weight:bold; flex-shrink:0;">${idx + 1}.</span>
                        <span style="font-size:15px; font-weight:600; color:${p.status === 'confirmado' ? '#1f2937' : '#9ca3af'}; text-decoration:${p.status === 'ausente' ? 'line-through' : 'none'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.name}</span>
                        <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span>
                        <span class="status-label ${p.status}">${statusLabel}</span>
                    </div>
                    ${isAdmin ? `<button class="btn-del" onclick="removePlayer(${p.id})">🗑️</button>` : ''}
                `;
                listEl.appendChild(li);
            });

            const totalFemale = players.filter(p => p.sex === 'F').length;
            const totalMale = players.filter(p => p.sex === 'M').length;
            document.getElementById('total-female').innerText = totalFemale;
            document.getElementById('total-male').innerText = totalMale;
            document.getElementById('total-players').innerText = players.length;

            document.getElementById('btn-reset').style.display = (gameStarted && isAdmin) ? 'block' : 'none';
            document.getElementById('btn-start').style.display = (!gameStarted && isAdmin) ? 'block' : 'none';

            // Quadra
            document.getElementById('wins-a').innerText = `${teamAWins} 🏆`;
            document.getElementById('wins-b').innerText = `${teamBWins} 🏆`;

            const listA = document.getElementById('list-team-a');
            listA.innerHTML = '';
            teamA.forEach(p => {
                listA.innerHTML += `<li>${p.name} <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span> <span style="color:#9ca3af; font-size:11px;">(${p.matches}j)</span> ${isAdmin ? `<span onclick="removePlayer(${p.id})" style="cursor:pointer; color:#ef4444; float:right;">✕</span>` : ''}</li>`;
            });

            const listB = document.getElementById('list-team-b');
            listB.innerHTML = '';
            teamB.forEach(p => {
                listB.innerHTML += `<li>${p.name} <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span> <span style="color:#9ca3af; font-size:11px;">(${p.matches}j)</span> ${isAdmin ? `<span onclick="removePlayer(${p.id})" style="cursor:pointer; color:#ef4444; float:right;">✕</span>` : ''}</li>`;
            });

            document.getElementById('btn-win-a').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-win-b').style.display = isAdmin ? 'block' : 'none';

            // Fila de Espera
            const queueEl = document.getElementById('queue-list');
            queueEl.innerHTML = '';
            document.getElementById('queue-count').innerText = `${queue.length} pessoas`;

            if (queue.length === 0) {
                queueEl.innerHTML = '<li style="color:#9ca3af; text-align:center; padding:16px;">Fila vazia</li>';
            } else {
                queue.forEach((p, idx) => {
                    const isUrgent = p.waitCount >= 2;
                    queueEl.innerHTML += `
                        <li class="queue-item ${isUrgent ? 'priority' : ''}">
                            <div>
                                <span style="color:#9ca3af; font-size:12px; margin-right:4px;">${idx + 1}º</span>
                                <b>${p.name}</b>
                                <span style="color:#9ca3af; font-size:11px; margin-left:4px;">(${p.matches}j)</span>
                                <span class="tag-wait ${isUrgent ? 'urgent' : ''}" style="margin-left:6px;">Espera: ${p.waitCount}</span>
                            </div>
                            ${isAdmin ? `
                            <div class="queue-controls">
                                <button onclick="moveQueue(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                                <button onclick="moveQueue(${idx}, 1)" ${idx === queue.length - 1 ? 'disabled' : ''}>▼</button>
                                <button onclick="removePlayer(${p.id})" style="color:#ef4444;">✕</button>
                            </div>` : ''}
                        </li>
                    `;
                });
            }

            // Resenha / Ranking
            const resenhaEl = document.getElementById('resenha-list');
            resenhaEl.innerHTML = '';
            const ranked = [...players].sort((a, b) => b.wins - a.wins || b.matches - a.matches);

            ranked.forEach((p, idx) => {
                const pct = p.matches > 0 ? Math.round((p.wins / p.matches) * 100) : 0;
                let badgeClass = '';
                if (idx === 0) badgeClass = 'gold';
                else if (idx === 1) badgeClass = 'silver';
                else if (idx === 2) badgeClass = 'bronze';

                resenhaEl.innerHTML += `
                    <li class="rank-item">
                        <div class="rank-pos ${badgeClass}">${idx + 1}</div>
                        <div class="rank-details">
                            <div style="font-weight:bold; font-size:14px;">${p.name}</div>
                            <div class="rank-stats">
                                <span>🏐 ${p.matches} Jogos</span>
                                <span style="color:#16a34a; font-weight:bold;">🏆 ${p.wins} Vitórias</span>
                            </div>
                        </div>
                        <div class="rank-pct">
                            <div class="rank-pct-label">Aprov.</div>
                            <div class="rank-pct-val">${pct}%</div>
                        </div>
                    </li>
                `;
            });
        }

        // Navegação de Abas
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-lista').style.display = tab === 'lista' ? 'block' : 'none';
            document.getElementById('tab-quadra').style.display = tab === 'quadra' ? 'block' : 'none';
            document.getElementById('tab-resenha').style.display = tab === 'resenha' ? 'block' : 'none';

            document.getElementById('btn-tab-lista').className = 'tab-btn' + (tab === 'lista' ? ' active' : '');
            document.getElementById('btn-tab-quadra').className = 'tab-btn' + (tab === 'quadra' ? ' active' : '');
            document.getElementById('btn-tab-resenha').className = 'tab-btn' + (tab === 'resenha' ? ' active' : '');
        }

        
        function switchTab(t){currentTab=t;document.getElementById('tab-lista').style.display=t==='lista'?'block':'none';document.getElementById('tab-quadra').style.display=t==='quadra'?'block':'none';document.getElementById('tab-resenha').style.display=t==='resenha'?'block':'none';document.getElementById('btn-tab-lista').className='tab-btn'+(t==='lista'?' active':'');document.getElementById('btn-tab-quadra').className='tab-btn'+(t==='quadra'?' active':'');document.getElementById('btn-tab-resenha').className='tab-btn'+(t==='resenha'?' active':'')}
function openLoginModal(){document.getElementById('login-modal').style.display='flex'}function closeLoginModal(){document.getElementById('login-modal').style.display='none';document.getElementById('admin-email').value='';document.getElementById('admin-pass').value=''}
async function loginAdmin(){const email=document.getElementById('admin-email').value.trim(),pass=document.getElementById('admin-pass').value;if(!email||!pass){alert('Informe o e-mail e a senha.');return}const {data,error}=await db.auth.signInWithPassword({email,password:pass});if(error){alert('E-mail ou senha incorretos.');console.error(error);return}currentAdmin=data.user.email;closeLoginModal();render()}
async function logoutAdmin(){await db.auth.signOut();currentAdmin=null;render()}
async function addPlayer(){
    if(!currentAdmin)return;
    if(players.length>=40){alert('A lista atingiu o limite máximo de 40 pessoas.');return}
    const input=document.getElementById('player-name'),sex=document.getElementById('player-sex').value,name=input.value.trim();
    if(!name)return;
    const p={id:Date.now(),name,sex,status:'pendente',confirmed:false,matches:0,wins:0,waitCount:0,queueOrder:nextQueueOrder++};
    players.push(p);
    try{await persistAll();input.value='';render()}catch(e){players=players.filter(x=>x.id!==p.id);alert('Não foi possível salvar o jogador.');console.error(e)}
}
async function togglePresence(id){
    if(!currentAdmin)return;
    const p=players.find(x=>x.id===id);
    if(!p)return;
    const next={confirmado:'ausente',ausente:'pendente',pendente:'confirmado'}[p.status]||'pendente';
    if(next==='confirmado' && players.filter(x=>x.status==='confirmado').length>=30){alert('Já existem 30 jogadores confirmados. Para confirmar este jogador, primeiro marque outro como ausente ou pendente.');return}
    const oldStatus=p.status;
    const wasInA=teamA.some(x=>x.id===p.id);
    const wasInB=teamB.some(x=>x.id===p.id);
    const wasInQueue=queue.some(x=>x.id===p.id);
    p.status=next;p.confirmed=next==='confirmado';

    // Ausente/Pendente nunca podem permanecer na quadra ou na fila.
    if(!p.confirmed){
        queue=queue.filter(x=>x.id!==p.id);
        teamA=teamA.filter(x=>x.id!==p.id);
        teamB=teamB.filter(x=>x.id!==p.id);
    }

    // Se alguém chegar depois e for confirmado durante o jogo, entra no fim da fila.
    if(p.confirmed && !wasInA && !wasInB && !wasInQueue && gameStarted){
        p.waitCount=0;
        queue.push(p);
    }

    // Se alguém saiu da quadra por ficar ausente/pendente, recompõe as vagas
    // usando somente confirmados e mantendo a regra de mulheres + ordem da fila.
    if(gameStarted && !p.confirmed && (wasInA || wasInB)){
        const requiredWomen=requiredWomenPerTeam(players.filter(x=>x.status==='confirmado'));
        const candidates=queue.filter(x=>x.status==='confirmado');
        const composed=composeTeams(candidates,teamA,teamB,requiredWomen);
        teamA=composed.A;
        teamB=composed.B;
        queue=composed.remaining;
        teamA.forEach(x=>x.waitCount=0);
        teamB.forEach(x=>x.waitCount=0);
    }

    try{
        await persistAll();
        render();
    }catch(e){
        p.status=oldStatus;p.confirmed=oldStatus==='confirmado';
        alert('Não foi possível salvar a alteração.');console.error(e);
    }
}
async function removePlayer(id){if(!currentAdmin||!confirm('Remover este jogador?'))return;const old=[players,teamA,teamB,queue].map(x=>[...x]);players=players.filter(p=>p.id!==id);queue=queue.filter(p=>p.id!==id);if(teamA.some(p=>p.id===id)){teamA=teamA.filter(p=>p.id!==id);if(queue.length)teamA.push({...queue.shift(),waitCount:0})}if(teamB.some(p=>p.id===id)){teamB=teamB.filter(p=>p.id!==id);if(queue.length)teamB.push({...queue.shift(),waitCount:0})}try{const {error}=await db.from('jogadores').delete().eq('id',id);if(error)throw error;await persistAll();render()}catch(e){[players,teamA,teamB,queue]=old;alert('Não foi possível remover o jogador.');console.error(e)}}
function requiredWomenPerTeam(c=players.filter(p=>p.status==='confirmado')){const w=c.filter(p=>p.sex==='F').length;return c.length>0&&w/c.length>=0.5?2:1}
// A ordem da fila exibida na tela é a prioridade real de entrada.
// A regra de sexo vem primeiro; dentro dela, respeitamos exatamente a ordem da fila.
function takeBestWoman(pool){const idx=pool.findIndex(p=>p.sex==='F');if(idx===-1)return null;return pool.splice(idx,1)[0]}
function composeTeams(pool,keepA=[],keepB=[],requiredWomen=1){
    // NÃO ordenar por waitCount/queueOrder: a fila pode ser reordenada manualmente pelo ADM.
    // Portanto, pool[0] é sempre o primeiro da fila.
    const available=[...pool],A=[...keepA],B=[...keepB];
    const fillRequiredWomen=team=>{
        let missing=Math.max(0,requiredWomen-team.filter(p=>p.sex==='F').length);
        while(missing>0&&team.length<4){
            const woman=takeBestWoman(available);
            if(!woman)break;
            team.push(woman);
            missing--;
        }
    };
    // Primeiro garante a quantidade mínima de mulheres em cada time.
    fillRequiredWomen(A);
    fillRequiredWomen(B);
    // Depois, preenche todas as vagas restantes seguindo a ordem atual da fila.
    while(A.length<4&&available.length)A.push(available.shift());
    while(B.length<4&&available.length)B.push(available.shift());
    return{A,B,remaining:available};
}
async function startGame(){if(!currentAdmin)return;const confirmed=players.filter(p=>p.status==='confirmado').map(p=>({...p,waitCount:0}));if(confirmed.length<8){alert('É necessário pelo menos 8 confirmados para iniciar!');return}const requiredWomen=requiredWomenPerTeam(confirmed),womenCount=confirmed.filter(p=>p.sex==='F').length;if(womenCount<requiredWomen*2){alert(`Não é possível iniciar: a regra atual exige ${requiredWomen} mulher(es) por time, mas há apenas ${womenCount} mulher(es) confirmada(s).`);return}const composed=composeTeams(confirmed,[],[],requiredWomen);teamA=composed.A;teamB=composed.B;queue=composed.remaining;teamAWins=teamBWins=0;gameStarted=true;try{await persistAll();render();switchTab('quadra')}catch(e){gameStarted=false;teamA=[];teamB=[];queue=[];alert('Não foi possível iniciar o jogo.');console.error(e)}}
async function handleWin(winner){if(!currentAdmin||!gameStarted)return;teamA.forEach(p=>{p.matches++;if(winner==='A')p.wins++;const m=players.find(x=>x.id===p.id);if(m){m.matches=p.matches;m.wins=p.wins}});teamB.forEach(p=>{p.matches++;if(winner==='B')p.wins++;const m=players.find(x=>x.id===p.id);if(m){m.matches=p.matches;m.wins=p.wins}});queue.forEach(p=>p.waitCount++);let leaving=[];if(winner==='A'){teamAWins++;teamBWins=0;if(teamAWins===2){leaving=[...teamA,...teamB];teamA=[];teamB=[];teamAWins=0}else{leaving=[...teamB];teamB=[]}}else{teamBWins++;teamAWins=0;if(teamBWins===2){leaving=[...teamA,...teamB];teamA=[];teamB=[];teamBWins=0}else{leaving=[...teamA];teamA=[]}}leaving.forEach(p=>p.waitCount=0);const neededA=4-teamA.length,neededB=4-teamB.length,totalNeeded=neededA+neededB;let available=[...queue];const requiredWomen=requiredWomenPerTeam(players.filter(p=>p.status==='confirmado'));const candidatePool=[...available.filter(p=>p.status==='confirmado'),...leaving.filter(p=>p.status==='confirmado')];const composed=composeTeams(candidatePool,teamA,teamB,requiredWomen);teamA=composed.A;teamB=composed.B;queue=composed.remaining;teamA.forEach(p=>p.waitCount=0);teamB.forEach(p=>p.waitCount=0);try{await persistAll();render()}catch(e){alert('A vitória foi processada, mas não foi possível sincronizar com o Supabase.');console.error(e)}}
async function moveQueue(idx,dir){if(!currentAdmin)return;const target=idx+dir;if(target<0||target>=queue.length)return;[queue[idx],queue[target]]=[queue[target],queue[idx]];try{await persistState();render()}catch(e){[queue[idx],queue[target]]=[queue[target],queue[idx]];alert('Não foi possível salvar a ordem da fila.');console.error(e)}}
async function resetGame(){if(!currentAdmin)return;if(!confirm('Reiniciar o jogo e zerar também todo o histórico da Resenha?'))return;players.forEach(p=>{p.matches=0;p.wins=0;p.waitCount=0});teamA=[];teamB=[];queue=[];teamAWins=teamBWins=0;gameStarted=false;try{await persistAll();switchTab('lista');render()}catch(e){alert('Não foi possível reiniciar o jogo no Supabase.');console.error(e)}}
async function init(){const {data}=await db.auth.getSession();currentAdmin=data.session?.user?.email||null;render();db.auth.onAuthStateChange((_e,s)=>{currentAdmin=s?.user?.email||null;render()});setupRealtime();await loadState()}
