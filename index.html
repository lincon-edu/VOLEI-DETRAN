<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rotação Vôlei</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; padding-bottom: 75px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #16a34a; color: white; padding: 12px 16px; font-weight: bold; font-size: 17px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .header button { border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-auth { background: #15803d; color: white; border: 1px solid #86efac !important; }
        .btn-danger { background: #ef4444; color: white; }
        .content { padding: 16px; flex: 1; }
        
        .card { background: white; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
        .card-header { background: #f9fafb; padding: 10px 14px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #16a34a; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        .input-group input { flex: 1; min-width:0; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
        .input-group select { width:72px; padding:12px 8px; border:1px solid #d1d5db; border-radius:8px; font-size:15px; background:white; }
        .sex-tag { font-size:10px; font-weight:bold; padding:2px 6px; border-radius:10px; margin-left:6px; background:#e5e7eb; color:#4b5563; }
        .sex-tag.f { background:#fce7f3; color:#9d174d; }
        .btn-add { background: #16a34a; color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 18px; }

        ul { list-style: none; }
        li { padding: 12px 14px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        li:last-child { border-bottom: none; }

        .check-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 10px; }
        .btn-del { background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 6px; }

        .start-btn { width: 100%; background: #16a34a; color: white; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Quadra */
        .teams-grid { display: flex; gap: 10px; margin-bottom: 16px; }
        .team-col { flex: 1; border-radius: 8px; border: 2px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; background: white; }
        .team-a { border-color: #3b82f6; }
        .team-b { border-color: #ef4444; }
        .team-title { color: white; padding: 8px 10px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; }
        .team-title-a { background: #3b82f6; }
        .team-title-b { background: #ef4444; }
        .team-list { min-height: 140px; padding: 6px; flex: 1; }
        .team-list li { padding: 6px 4px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #f9fafb; }
        .btn-win-a { width: 100%; padding: 12px 0; background: #dbeafe; color: #1e40af; border: none; border-top: 1px solid #bfdbfe; font-weight: bold; cursor: pointer; }
        .btn-win-b { width: 100%; padding: 12px 0; background: #fee2e2; color: #991b1b; border: none; border-top: 1px solid #fecaca; font-weight: bold; cursor: pointer; }

        /* Fila */
        .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #f3f4f6; }
        .queue-item.priority { background: #fff7ed; border-left: 4px solid #f97316; }
        .queue-controls button { background: #f3f4f6; border: 1px solid #e5e7eb; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .tag-wait { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e5e7eb; font-weight: bold; }
        .tag-wait.urgent { background: #f97316; color: white; }

        /* Resenha / Ranking */
        .rank-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #f3f4f6; }
        .rank-pos { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #fff; background: #9ca3af; }
        .rank-pos.gold { background: #eab308; }
        .rank-pos.silver { background: #94a3b8; }
        .rank-pos.bronze { background: #d97706; }
        .rank-details { flex: 1; }
        .rank-stats { display: flex; gap: 12px; font-size: 12px; color: #6b7280; margin-top: 2px; }
        .rank-pct { text-align: right; }
        .rank-pct-label { font-size: 10px; color: #9ca3af; text-transform: uppercase; font-weight: bold; }
        .rank-pct-val { font-size: 15px; font-weight: bold; color: #16a34a; }

        /* Modal Login */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 360px; padding: 20px; border-radius: 12px; }
        .modal-body h3 { margin-bottom: 12px; }
        .modal-body input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

        /* Tabbar */
        .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 60px; background: white; border-top: 1px solid #e5e7eb; display: flex; z-index: 20; }
        .tab-btn { flex: 1; border: none; background: transparent; font-weight: bold; font-size: 13px; color: #6b7280; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
        .tab-btn.active { color: #16a34a; border-top: 3px solid #16a34a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span>🏐 Rotação Vôlei</span>
            <div class="header-actions">
                <button id="btn-login" class="btn-auth" onclick="openLoginModal()">🔑 Entrar ADM</button>
                <button id="btn-reset" class="btn-danger" style="display:none;" onclick="resetGame()">Reiniciar</button>
            </div>
        </div>

        <!-- ABA 1: LISTA -->
        <div class="content" id="tab-lista">
            <div class="input-group" id="admin-add-section" style="display:none;">
                <input type="text" id="player-name" placeholder="Adicionar jogador..." onkeydown="if(event.key==='Enter') addPlayer()">
                <select id="player-sex" aria-label="Sexo"><option value="M">M</option><option value="F">F</option></select>
                <button class="btn-add" onclick="addPlayer()">+</button>
            </div>
            <div class="card">
                <div class="card-header">
                    <span>Lista de Jogadores</span>
                    <span class="badge" id="confirmed-count">0 Confirmados</span>
                </div>
                <ul id="players-list" style="max-height: 480px; overflow-y: auto;"></ul>
                <div id="player-summary" style="padding:12px 14px; border-top:1px solid #e5e7eb; background:#f9fafb; font-size:13px; line-height:1.7;">
                    <div><strong>Total Mulheres:</strong> <span id="total-female">0</span></div>
                    <div><strong>Total Homens:</strong> <span id="total-male">0</span></div>
                    <div><strong>Total jogadores:</strong> <span id="total-players">0</span></div>
                </div>
            </div>
            <button class="start-btn" id="btn-start" style="display:none;" onclick="startGame()">Começar Jogo ➔</button>
        </div>

        <!-- ABA 2: QUADRA -->
        <div class="content" id="tab-quadra" style="display:none;">
            <div class="teams-grid">
                <div class="team-col team-a" id="card-team-a">
                    <div class="team-title team-title-a"><span>TIME A</span><span id="wins-a">0 🏆</span></div>
                    <ul class="team-list" id="list-team-a"></ul>
                    <button class="btn-win-a" id="btn-win-a" style="display:none;" onclick="handleWin('A')">VENCEU</button>
                </div>
                <div class="team-col team-b" id="card-team-b">
                    <div class="team-title team-title-b"><span>TIME B</span><span id="wins-b">0 🏆</span></div>
                    <ul class="team-list" id="list-team-b"></ul>
                    <button class="btn-win-b" id="btn-win-b" style="display:none;" onclick="handleWin('B')">VENCEU</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>Fila de Espera</span>
                    <span style="font-size:12px; color:#6b7280;" id="queue-count">0 pessoas</span>
                </div>
                <ul id="queue-list" style="max-height: 420px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- ABA 3: RESENHA -->
        <div class="content" id="tab-resenha" style="display:none;">
            <div class="card">
                <div class="card-header" style="background: #15803d; color: white;">
                    <span>📊 Estatísticas & Ranking</span>
                    <span style="font-size:11px; opacity:0.9;">Mais Vitórias</span>
                </div>
                <ul id="resenha-list" style="max-height: 520px; overflow-y: auto;"></ul>
            </div>
        </div>

        <!-- TABBAR INFERIOR -->
        <div class="tabbar">
            <button class="tab-btn active" id="btn-tab-lista" onclick="switchTab('lista')">Lista</button>
            <button class="tab-btn" id="btn-tab-quadra" onclick="switchTab('quadra')">Quadra</button>
            <button class="tab-btn" id="btn-tab-resenha" onclick="switchTab('resenha')">Resenha</button>
        </div>
    </div>

    <!-- MODAL DE LOGIN ADM -->
    <div class="modal" id="login-modal">
        <div class="modal-body">
            <h3>Acesso Administrativo</h3>
            <input type="email" id="admin-email" placeholder="E-mail do Supabase" autocomplete="username">
            <input type="password" id="admin-pass" placeholder="Senha do Supabase" autocomplete="current-password">
            <div class="modal-actions">
                <button onclick="closeLoginModal()" style="padding:8px 12px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer;">Cancelar</button>
                <button onclick="loginAdmin()" style="padding:8px 14px; background:#16a34a; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Entrar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://oxacdamrkrokzocamvfw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uusWwV0ef8ux-Dr__IFlPA_WGwQpAqO';
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Autenticação exclusivamente pelo Supabase Auth.
        // Não existem mais usuários/senhas administrativos gravados neste HTML.
        let currentAdmin = null;
        let supabaseSession = null;
        let currentTab = 'lista';
        let gameStarted = false;
        let teamAWins = 0;
        let teamBWins = 0;
        let syncing = false;

        const jogadoresIniciais = [
            ["Victor","M"], ["Joao V","M"], ["Glauber","M"], ["Lucas","M"], ["Mateus","M"], ["Gabriel","M"],
            ["Rafael","M"], ["João","M"], ["Pedro","M"], ["Tiago","M"], ["Marcos","M"], ["André","M"],
            ["Felipe","M"], ["Carlos","M"], ["Eduardo","M"], ["Marcelo","M"], ["Gustavo","M"], ["Fernando","M"],
            ["Bruno","M"], ["Diego","M"], ["Leonardo","M"], ["Thiago","M"], ["Rodrigo","M"],
            ["Ana","F"], ["Julia","F"], ["Beatriz","F"], ["Mariana","F"], ["Camila","F"], ["Letícia","F"], ["Amanda","F"]
        ];

        let players = [];
        let teamA = [];
        let teamB = [];
        let queue = [];
        let nextQueueOrder = 1;

        function mapPlayer(row) {
            return {
                id: Number(row.id),
                name: row.nome,
                sex: row.sexo,
                confirmed: !!row.confirmado,
                matches: Number(row.partidas || 0),
                wins: Number(row.vitorias || 0),
                waitCount: Number(row.espera || 0),
                queueOrder: Number(row.queue_order || row.id)
            };
        }

        function playerPayload(p) {
            return {
                nome: p.name,
                sexo: p.sex,
                confirmado: p.confirmed,
                partidas: p.matches,
                vitorias: p.wins,
                espera: p.waitCount
            };
        }

        async function loadState() {
            syncing = true;

            const [{ data: playerRows, error: pErr },
                   { data: stateRows, error: sErr },
                   { data: placementRows, error: jErr }] = await Promise.all([
                db.from('jogadores').select('*').order('id', { ascending: true }),
                db.from('estado_jogo').select('*').eq('id', 1).maybeSingle(),
                db.from('jogo_jogadores').select('*').order('posicao', { ascending: true })
            ]);

            if (pErr) console.error('Erro carregando jogadores:', pErr);
            if (sErr) console.error('Erro carregando estado:', sErr);
            if (jErr) console.error('Erro carregando posições:', jErr);

            if (playerRows && playerRows.length) {
                players = playerRows.map(mapPlayer);

                const placements = placementRows || [];
                const byId = new Map(players.map(p => [p.id, p]));
                teamA = placements
                    .filter(x => x.localizacao === 'TIME_A')
                    .sort((a,b) => a.posicao-b.posicao)
                    .map(x => byId.get(Number(x.jogador_id)))
                    .filter(Boolean);
                teamB = placements
                    .filter(x => x.localizacao === 'TIME_B')
                    .sort((a,b) => a.posicao-b.posicao)
                    .map(x => byId.get(Number(x.jogador_id)))
                    .filter(Boolean);
                queue = placements
                    .filter(x => x.localizacao === 'FILA')
                    .sort((a,b) => a.posicao-b.posicao)
                    .map(x => byId.get(Number(x.jogador_id)))
                    .filter(Boolean);

                // Jogadores ainda não posicionados ficam na fila, sem alterar a ordem existente.
                const placed = new Set([...teamA, ...teamB, ...queue].map(p => p.id));
                players.filter(p => !placed.has(p.id)).forEach(p => queue.push(p));

                nextQueueOrder = Math.max(0, ...players.map(p => p.queueOrder || p.id)) + 1;
            }

            if (stateRows) {
                gameStarted = !!stateRows.iniciado;
                teamAWins = Number(stateRows.vitorias_time_a || 0);
                teamBWins = Number(stateRows.vitorias_time_b || 0);
            }

            syncing = false;
            render();
        }

        async function persistPlayers() {
            if (syncing || !players.length) return;
            for (const p of players) {
                const { error } = await db
                    .from('jogadores')
                    .update(playerPayload(p))
                    .eq('id', p.id);
                if (error) console.error('Erro salvando jogador', p.id, error);
            }
        }

        async function persistState() {
            const { error } = await db
                .from('estado_jogo')
                .upsert({
                    id: 1,
                    iniciado: gameStarted,
                    vitorias_time_a: teamAWins,
                    vitorias_time_b: teamBWins
                }, { onConflict: 'id' });
            if (error) console.error('Erro salvando estado do jogo:', error);
        }

        async function persistPlacements() {
            const rows = [];

            teamA.forEach((p, i) => rows.push({
                jogador_id: p.id,
                localizacao: 'TIME_A',
                posicao: i + 1
            }));
            teamB.forEach((p, i) => rows.push({
                jogador_id: p.id,
                localizacao: 'TIME_B',
                posicao: i + 1
            }));
            queue.forEach((p, i) => rows.push({
                jogador_id: p.id,
                localizacao: 'FILA',
                posicao: i + 1
            }));

            const { error: delError } = await db
                .from('jogo_jogadores')
                .delete()
                .neq('jogador_id', 0);

            if (delError) {
                console.error('Erro limpando posições:', delError);
                return;
            }

            if (rows.length) {
                const { error } = await db
                    .from('jogo_jogadores')
                    .insert(rows);
                if (error) console.error('Erro salvando posições:', error);
            }
        }

        async function persistAll() {
            await persistPlayers();
            await persistState();
            await persistPlacements();
        }

        async function insertPlayer(p) {
            const { data, error } = await db
                .from('jogadores')
                .insert(playerPayload(p))
                .select()
                .single();

            if (error) {
                console.error('Erro inserindo jogador:', error);
                alert('Não foi possível salvar o jogador no Supabase. Verifique as políticas RLS.');
                return null;
            }
            return mapPlayer(data);
        }

        async function deletePlayerFromDb(id) {
            const { error } = await db.from('jogadores').delete().eq('id', id);
            if (error) {
                console.error('Erro removendo jogador:', error);
                alert('Não foi possível remover o jogador do Supabase.');
                return false;
            }
            return true;
        }

        function render() {
            const isAdmin = currentAdmin !== null;

            const btnLogin = document.getElementById('btn-login');
            if (isAdmin) {
                btnLogin.innerText = `Sair (${currentAdmin})`;
                btnLogin.onclick = logoutAdmin;
                btnLogin.className = 'btn-danger';
            } else {
                btnLogin.innerText = '🔑 Entrar ADM';
                btnLogin.onclick = openLoginModal;
                btnLogin.className = 'btn-auth';
            }

            document.getElementById('admin-add-section').style.display = isAdmin ? 'flex' : 'none';

            const listEl = document.getElementById('players-list');
            listEl.innerHTML = '';
            const confirmed = players.filter(p => p.confirmed);
            document.getElementById('confirmed-count').innerText = `${confirmed.length} Confirmados`;

            players.forEach((p, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div style="display:flex; align-items:center; min-width:0;">
                        <button class="check-btn" style="background:${p.confirmed ? '#16a34a' : '#d1d5db'}; cursor:${isAdmin ? 'pointer' : 'default'};" ${isAdmin ? `onclick="togglePresence(${p.id})"` : 'disabled'}>
                            ${p.confirmed ? '✓' : '✕'}
                        </button>
                        <span style="width:28px; color:#6b7280; font-size:13px; font-weight:bold; flex-shrink:0;">${idx + 1}.</span>
                        <span style="font-size:15px; font-weight:600; color:${p.confirmed ? '#1f2937' : '#9ca3af'}; text-decoration:${p.confirmed ? 'none' : 'line-through'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                            ${p.name}
                        </span>
                        <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span>
                    </div>
                    ${isAdmin ? `<button class="btn-del" onclick="removePlayer(${p.id})">🗑️</button>` : ''}
                `;
                listEl.appendChild(li);
            });

            document.getElementById('total-female').innerText = players.filter(p => p.sex === 'F').length;
            document.getElementById('total-male').innerText = players.filter(p => p.sex === 'M').length;
            document.getElementById('total-players').innerText = players.length;

            document.getElementById('btn-reset').style.display = (gameStarted && isAdmin) ? 'block' : 'none';
            document.getElementById('btn-start').style.display = (!gameStarted && isAdmin) ? 'block' : 'none';

            document.getElementById('wins-a').innerText = `${teamAWins} 🏆`;
            document.getElementById('wins-b').innerText = `${teamBWins} 🏆`;

            const listA = document.getElementById('list-team-a');
            listA.innerHTML = '';
            teamA.forEach(p => {
                listA.innerHTML += `<li>${p.name} <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span> <span style="color:#9ca3af; font-size:11px;">(${p.matches}j)</span> ${isAdmin ? `<span onclick="removePlayer(${p.id})" style="cursor:pointer; color:#ef4444; float:right;">✕</span>` : ''}</li>`;
            });

            const listB = document.getElementById('list-team-b');
            listB.innerHTML = '';
            teamB.forEach(p => {
                listB.innerHTML += `<li>${p.name} <span class="sex-tag ${p.sex === 'F' ? 'f' : ''}">${p.sex}</span> <span style="color:#9ca3af; font-size:11px;">(${p.matches}j)</span> ${isAdmin ? `<span onclick="removePlayer(${p.id})" style="cursor:pointer; color:#ef4444; float:right;">✕</span>` : ''}</li>`;
            });

            document.getElementById('btn-win-a').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('btn-win-b').style.display = isAdmin ? 'block' : 'none';

            const queueEl = document.getElementById('queue-list');
            queueEl.innerHTML = '';
            document.getElementById('queue-count').innerText = `${queue.length} pessoas`;

            if (queue.length === 0) {
                queueEl.innerHTML = '<li style="color:#9ca3af; text-align:center; padding:16px;">Fila vazia</li>';
            } else {
                queue.forEach((p, idx) => {
                    const isUrgent = p.waitCount >= 2;
                    queueEl.innerHTML += `
                        <li class="queue-item ${isUrgent ? 'priority' : ''}">
                            <div>
                                <span style="color:#9ca3af; font-size:12px; margin-right:4px;">${idx + 1}º</span>
                                <b>${p.name}</b>
                                <span style="color:#9ca3af; font-size:11px; margin-left:4px;">(${p.matches}j)</span>
                                <span class="tag-wait ${isUrgent ? 'urgent' : ''}" style="margin-left:6px;">Espera: ${p.waitCount}</span>
                            </div>
                            ${isAdmin ? `
                            <div class="queue-controls">
                                <button onclick="moveQueue(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                                <button onclick="moveQueue(${idx}, 1)" ${idx === queue.length - 1 ? 'disabled' : ''}>▼</button>
                                <button onclick="removePlayer(${p.id})" style="color:#ef4444;">✕</button>
                            </div>` : ''}
                        </li>
                    `;
                });
            }

            const resenhaEl = document.getElementById('resenha-list');
            resenhaEl.innerHTML = '';
            const ranked = [...players].sort((a, b) => b.wins - a.wins || b.matches - a.matches);

            ranked.forEach((p, idx) => {
                const pct = p.matches > 0 ? Math.round((p.wins / p.matches) * 100) : 0;
                let badgeClass = '';
                if (idx === 0) badgeClass = 'gold';
                else if (idx === 1) badgeClass = 'silver';
                else if (idx === 2) badgeClass = 'bronze';

                resenhaEl.innerHTML += `
                    <li class="rank-item">
                        <div class="rank-pos ${badgeClass}">${idx + 1}</div>
                        <div class="rank-details">
                            <div style="font-weight:bold; font-size:14px;">${p.name}</div>
                            <div class="rank-stats">
                                <span>🏐 ${p.matches} Jogos</span>
                                <span style="color:#16a34a; font-weight:bold;">🏆 ${p.wins} Vitórias</span>
                            </div>
                        </div>
                        <div class="rank-pct">
                            <div class="rank-pct-label">Aprov.</div>
                            <div class="rank-pct-val">${pct}%</div>
                        </div>
                    </li>
                `;
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-lista').style.display = tab === 'lista' ? 'block' : 'none';
            document.getElementById('tab-quadra').style.display = tab === 'quadra' ? 'block' : 'none';
            document.getElementById('tab-resenha').style.display = tab === 'resenha' ? 'block' : 'none';
            document.getElementById('btn-tab-lista').className = 'tab-btn' + (tab === 'lista' ? ' active' : '');
            document.getElementById('btn-tab-quadra').className = 'tab-btn' + (tab === 'quadra' ? ' active' : '');
            document.getElementById('btn-tab-resenha').className = 'tab-btn' + (tab === 'resenha' ? ' active' : '');
        }

        function openLoginModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-pass').value = '';
        }

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (!email || !pass) {
                alert('Informe o e-mail e a senha do Supabase.');
                return;
            }

            const { data, error } = await db.auth.signInWithPassword({
                email,
                password: pass
            });

            if (error) {
                console.error('Erro no login Supabase:', error);
                alert('E-mail ou senha inválidos.');
                return;
            }

            supabaseSession = data.session;
            currentAdmin = data.user?.email || email;
            closeLoginModal();
            render();
        }

        async function logoutAdmin() {
            await db.auth.signOut();
            supabaseSession = null;
            currentAdmin = null;
            render();
        }

        async function initSupabaseAuth() {
            const { data, error } = await db.auth.getSession();
            if (error) console.error('Erro recuperando sessão Supabase:', error);

            supabaseSession = data?.session || null;
            currentAdmin = supabaseSession?.user?.email || null;
            render();

            db.auth.onAuthStateChange((event, session) => {
                supabaseSession = session;
                currentAdmin = session?.user?.email || null;
                render();
            });
        }

        function requiredWomenPerTeam(confirmedPlayers = players.filter(p => p.confirmed)) {
            const women = confirmedPlayers.filter(p => p.sex === 'F').length;
            return confirmedPlayers.length > 0 && women / confirmedPlayers.length >= 0.5 ? 2 : 1;
        }

        function waitingPriority(a, b) {
            return b.waitCount - a.waitCount || a.queueOrder - b.queueOrder;
        }

        function takeBestWoman(pool) {
            const candidates = pool.filter(p => p.sex === 'F').sort(waitingPriority);
            if (!candidates.length) return null;
            const chosen = candidates[0];
            pool.splice(pool.findIndex(p => p.id === chosen.id), 1);
            return chosen;
        }

        function composeTeams(pool, keepA = [], keepB = [], requiredWomen = 1) {
            const available = [...pool].sort(waitingPriority);
            const A = [...keepA], B = [...keepB];

            const fillRequiredWomen = team => {
                let missing = Math.max(0, requiredWomen - team.filter(p => p.sex === 'F').length);
                while (missing > 0 && team.length < 4) {
                    const woman = takeBestWoman(available);
                    if (!woman) break;
                    team.push(woman);
                    missing--;
                }
            };

            fillRequiredWomen(A);
            fillRequiredWomen(B);

            while (A.length < 4 && available.length) A.push(available.shift());
            while (B.length < 4 && available.length) B.push(available.shift());

            return { A, B, remaining: available };
        }

        async function addPlayer() {
            if (!currentAdmin) return;

            if (players.length >= 30) {
                alert("A lista atingiu o limite máximo de 30 pessoas.");
                return;
            }

            const input = document.getElementById('player-name');
            const sexInput = document.getElementById('player-sex');
            const name = input.value.trim();
            const sex = sexInput.value;

            if (!name) return;

            const tempPlayer = {
                name, sex, confirmed: true, matches: 0, wins: 0, waitCount: 0,
                queueOrder: nextQueueOrder++
            };

            const saved = await insertPlayer(tempPlayer);
            if (!saved) return;

            saved.queueOrder = tempPlayer.queueOrder;
            players.push(saved);

            if (gameStarted) {
                queue.push(saved);
                await persistPlacements();
            }

            input.value = '';
            render();
        }

        async function togglePresence(id) {
            if (!currentAdmin) return;
            const p = players.find(p => p.id === id);
            if (!p) return;

            p.confirmed = !p.confirmed;
            const { error } = await db.from('jogadores')
                .update({ confirmado: p.confirmed })
                .eq('id', p.id);

            if (error) {
                p.confirmed = !p.confirmed;
                console.error(error);
                alert('Não foi possível atualizar a confirmação.');
                return;
            }

            render();
        }

        async function removePlayer(id) {
            if (!currentAdmin) return;
            if (!confirm("Remover este jogador?")) return;

            const removed = players.find(p => p.id === id);
            if (!removed) return;

            const ok = await deletePlayerFromDb(id);
            if (!ok) return;

            players = players.filter(p => p.id !== id);
            queue = queue.filter(p => p.id !== id);
            teamA = teamA.filter(p => p.id !== id);
            teamB = teamB.filter(p => p.id !== id);

            // Se alguém sair da quadra durante o jogo, recompõe as vagas sem quebrar o estado.
            if (gameStarted) {
                const requiredWomen = requiredWomenPerTeam(players.filter(p => p.confirmed));
                const composed = composeTeams(queue, teamA, teamB, requiredWomen);
                teamA = composed.A;
                teamB = composed.B;
                queue = composed.remaining;
            }

            await persistPlacements();
            render();
        }

        async function startGame() {
            if (!currentAdmin) return;

            const confirmed = players.filter(p => p.confirmed).map(p => ({ ...p, waitCount: 0 }));

            if (confirmed.length < 8) {
                alert("É necessário pelo menos 8 confirmados para iniciar!");
                return;
            }

            const requiredWomen = requiredWomenPerTeam(confirmed);
            const womenCount = confirmed.filter(p => p.sex === 'F').length;

            if (womenCount < requiredWomen * 2) {
                alert(`Não é possível iniciar: a regra atual exige ${requiredWomen} mulher(es) por time, mas há apenas ${womenCount} mulher(es) confirmada(s).`);
                return;
            }

            const composed = composeTeams(confirmed, [], [], requiredWomen);
            if (composed.A.length !== 4 || composed.B.length !== 4) {
                alert('Não foi possível montar dois times completos.');
                return;
            }

            teamA = composed.A;
            teamB = composed.B;
            queue = composed.remaining;

            teamAWins = 0;
            teamBWins = 0;
            gameStarted = true;

            await persistAll();
            render();
            switchTab('quadra');
        }

        async function handleWin(winner) {
            if (!currentAdmin || !gameStarted) return;

            // Contabilizar partidas e vitórias
            teamA.forEach(p => {
                p.matches++;
                if (winner === 'A') p.wins++;
                const mainP = players.find(x => x.id === p.id);
                if (mainP) { mainP.matches = p.matches; mainP.wins = p.wins; }
            });

            teamB.forEach(p => {
                p.matches++;
                if (winner === 'B') p.wins++;
                const mainP = players.find(x => x.id === p.id);
                if (mainP) { mainP.matches = p.matches; mainP.wins = p.wins; }
            });

            queue.forEach(p => p.waitCount++);

            let leaving = [];

            // IMPORTANTE: esta parte é a regra ORIGINAL do arquivo enviado.
            // Uma equipe que vence duas vezes seguidas faz com que OS DOIS TIMES
            // deixem a quadra. Não alteramos essa regra.
            if (winner === 'A') {
                teamAWins++;
                teamBWins = 0;

                if (teamAWins === 2) {
                    leaving = [...teamA, ...teamB];
                    teamA = [];
                    teamB = [];
                    teamAWins = 0;
                } else {
                    leaving = [...teamB];
                    teamB = [];
                }
            } else {
                teamBWins++;
                teamAWins = 0;

                if (teamBWins === 2) {
                    leaving = [...teamA, ...teamB];
                    teamA = [];
                    teamB = [];
                    teamBWins = 0;
                } else {
                    leaving = [...teamA];
                    teamA = [];
                }
            }

            leaving.forEach(p => p.waitCount = 0);

            const neededA = 4 - teamA.length;
            const neededB = 4 - teamB.length;
            const totalNeeded = neededA + neededB;

            const priorityQueue = queue.filter(p => p.waitCount >= 2);
            const normalQueue = queue.filter(p => p.waitCount < 2);
            let available = [...priorityQueue, ...normalQueue];
            let entering = [];

            if (available.length >= totalNeeded) {
                entering = available.splice(0, totalNeeded);
                queue = [...available, ...leaving];
            } else {
                entering = [...available];
                queue = [];
                const missing = totalNeeded - entering.length;

                leaving.sort((a, b) => a.matches - b.matches);
                entering = [...entering, ...leaving.splice(0, missing)];
                queue = [...leaving];
            }

            entering.forEach(p => {
                p.waitCount = 0;
                if (teamA.length < 4) teamA.push(p);
                else teamB.push(p);
            });

            await persistAll();
            render();
        }

        async function moveQueue(idx, dir) {
            if (!currentAdmin) return;

            const target = idx + dir;
            if (target < 0 || target >= queue.length) return;

            const temp = queue[idx];
            queue[idx] = queue[target];
            queue[target] = temp;

            await persistPlacements();
            render();
        }

        async function resetGame() {
            if (!currentAdmin) return;

            if (confirm("Encerrar o jogo e voltar para a lista?")) {
                gameStarted = false;
                teamA = [];
                teamB = [];
                queue = [];

                teamAWins = 0;
                teamBWins = 0;

                // Reinício completo da partida: zera também o histórico da Resenha.
                // Como derrotas são calculadas por (partidas - vitórias), ambas
                // precisam voltar para zero junto com as partidas.
                players.forEach(p => {
                    p.matches = 0;
                    p.wins = 0;
                    p.waitCount = 0;
                });

                await persistPlayers();
                await persistState();
                await persistPlacements();

                switchTab('lista');
                render();
            }
        }

        // ============================================================
        // REALTIME
        // ============================================================
        let realtimeTimer = null;
        let realtimeBusy = false;

        async function refreshFromRealtime() {
            if (realtimeBusy) return;
            realtimeBusy = true;
            try {
                await loadState();
            } finally {
                realtimeBusy = false;
            }
        }

        db.channel('volei-detran-sync')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'jogadores' }, () => {
                clearTimeout(realtimeTimer);
                realtimeTimer = setTimeout(refreshFromRealtime, 150);
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'estado_jogo' }, () => {
                clearTimeout(realtimeTimer);
                realtimeTimer = setTimeout(refreshFromRealtime, 150);
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'jogo_jogadores' }, () => {
                clearTimeout(realtimeTimer);
                realtimeTimer = setTimeout(refreshFromRealtime, 150);
            })
            .subscribe((status) => {
                console.log('Realtime:', status);
            });

        // Inicialização.
        // O estado do jogo é público para leitura; as ações administrativas
        // só ficam disponíveis após uma sessão válida do Supabase Auth.
        render();
        initSupabaseAuth();
        loadState().catch(error => {
            console.error('Falha ao carregar o estado do Supabase:', error);
            alert('Não foi possível carregar os dados do Supabase.');
        });
    </script>
